gettingThere:
  - mode: 'Bus from PITX or Manila'
    text: 'Buses bound for Naic and Ternate leave from PITX and run along Antero Soriano Highway through Kawit, Noveleta, Rosario and Tanza, which ends in Naic.'
  - mode: 'Jeepney and baby bus'
    text: 'Jeepneys and baby buses link Naic with Tanza, Trece Martires, Indang and Maragondon. Tricycles cover the barangays.'
  - mode: 'Private vehicle'
    text: 'Naic is about 44 km from Manila. Take CAVITEX and continue on Antero Soriano Highway, or come down Aguinaldo Highway and cut across through Trece Martires.'
