history:
  source:
    label: 'Naic article on Wikipedia, and the historical marker at Naic Elementary School'
    url: 'https://en.wikipedia.org/wiki/Naic#History'
  events:
    - year: '1627'
      text: 'Jesuit missionaries reach Maragondon, whose territory then covered present-day Naic, Ternate and Magallanes.'
    - year: '1758'
      text: 'The Jesuits found a community and visita on the west bank of the river, in what is now Barangay Muzon, still under Maragondon.'
    - year: '1791'
      text: 'The community becomes a town of its own, according to local histories.'
    - year: '1798'
      text: 'The town center moves to the east bank of the river, the present poblacion.'
    - year: '1865'
      text: 'The parish passes to the Dominicans, who later build the Casa Hacienda de Naic to run the friar estate. The building is now Naic Elementary School.'
    - year: '1897'
      text: 'Casa Hacienda de Naic is the site of the Naic Military Agreement (Acta de Naic) signed by Andres Bonifacio and his allies in April, and of the cabinet Emilio Aguinaldo formed after the Tejeros Convention. The Battle of Timalan is fought in May.'
    - year: '1903'
      text: 'Ternate is merged into Naic under Act No. 947, until it is separated again in 1917.'
    - year: '1942'
      text: 'The Taparan guerrilla unit is founded in Naic in February and delays the Japanese advance while residents flee to Maragondon.'
    - year: '2024'
      text: 'The census counts 236,978 residents, up from 160,987 in 2020, as new subdivisions in Halang, Calubcob, Sabang and Timalan fill up.'
